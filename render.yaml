# Render Blueprint — KidGuard deployment.
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this file to the repo.
#   2. In Render dashboard → New + → Blueprint → pick this repo.
#   3. Render reads render.yaml and provisions everything below.
#   4. Set SECRET_KEY and JWT_SECRET_KEY when prompted (sync: false).

services:
  - type: web
    name: kidguard
    region: oregon
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kidguard-db
          property: connectionString
      - key: CLOUD_SERVER_URL
        value: https://kidguard-server.onrender.com
      - key: FLASK_AUTO_CREATE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: kidguard-db
    region: oregon
    plan: free
    databaseName: kidguard
    user: kidguard
