# Alembic configuration for the AnonChat / KidGuard server.
#
# The database URL is read from the Flask app config (env.py overrides this
# script's sqlalchemy.url at runtime), so the value below is only a fallback
# for offline `alembic` commands. In normal use, run migrations through the
# app context:  `alembic upgrade head`  (env.py calls create_app() internally).

[alembic]
script_location = migrations
# Fallback only — env.py reads SQLALCHEMY_DATABASE_URI from the Flask config.
sqlalchemy.url = sqlite:///tracking.db

# Timezone for the migration timestamps.
timezone = UTC

[post_write_hooks]
# Optional: format generated migrations with black if installed.
# hooks = black
# black.line_length = 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
