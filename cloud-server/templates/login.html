<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidGuard - Parental Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            display: flex;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.4);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        .auth-brand {
            padding: 48px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 320px;
        }
        .auth-brand h1 {
            color: white;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .auth-brand .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 16px;
            margin-bottom: 32px;
        }
        .auth-brand .features {
            list-style: none;
        }
        .auth-brand .features li {
            color: rgba(255,255,255,0.8);
            padding: 8px 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .auth-brand .features li::before {
            content: '✓';
            color: #4caf50;
            font-weight: bold;
        }
        .auth-form {
            padding: 48px;
            min-width: 380px;
        }
        .auth-form .tabs {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .auth-form .tabs button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 16px;
            font-weight: 600;
            padding: 12px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }
        .auth-form .tabs button.active {
            color: white;
            border-bottom-color: #667eea;
        }
        .auth-form h2 {
            color: white;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .auth-form .form-group {
            margin-bottom: 20px;
        }
        .auth-form label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .auth-form input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 14px;
            color: white;
            font-family: inherit;
            transition: all 0.2s;
        }
        .auth-form input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255,255,255,0.12);
        }
        .auth-form input::placeholder {
            color: rgba(255,255,255,0.3);
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }
        .error-msg.visible { display: block; }
        .auth-form .server-config {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .auth-form .server-config .hint {
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            margin-bottom: 8px;
        }
        @media (max-width: 768px) {
            .auth-container { flex-direction: column; }
            .auth-brand { padding: 32px; min-width: auto; }
            .auth-form { padding: 32px; min-width: auto; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-brand">
            <h1>KidGuard</h1>
            <p class="subtitle">Cloud Parental Control</p>
            <ul class="features">
                <li>Real-time location tracking</li>
                <li>Screen time monitoring</li>
                <li>App & web usage insights</li>
                <li>SMS & call logging</li>
                <li>Geofence alerts</li>
                <li>Remote device control</li>
            </ul>
        </div>
        <div class="auth-form">
            <div class="tabs">
                <button class="active" onclick="switchTab('login')">Sign In</button>
                <button onclick="switchTab('register')">Create Account</button>
            </div>
            <div id="errorMsg" class="error-msg"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <h2>Welcome Back</h2>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="parent@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">Sign In</button>
            </form>

            <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
                <h2>Create Parent Account</h2>
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="regName" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="parent@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password (min 6 chars)</label>
                    <input type="password" id="regPassword" placeholder="Create password" minlength="6" required>
                </div>
                <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
            </form>

            <div class="server-config">
                <div class="hint">Advanced: Configure custom server</div>
                <div class="form-group" style="margin-bottom:0">
                    <input type="text" id="serverUrl" placeholder="Server URL (optional)" 
                           value="">
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.querySelector(`.tabs button[onclick*="${tab}"]`).classList.add('active');
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('visible');
        }

        function clearError() {
            document.getElementById('errorMsg').classList.remove('visible');
        }

        async function handleLogin(e) {
            e.preventDefault();
            clearError();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            const customUrl = document.getElementById('serverUrl').value.trim();
            const apiUrl = customUrl ? customUrl.replace(/\/+$/, '') + '/api' : '/api';

            try {
                const res = await fetch(`${apiUrl}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value.trim().toLowerCase(),
                        password: document.getElementById('loginPassword').value
                    })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('kidguard_token', data.token);
                    localStorage.setItem('kidguard_refresh', data.refresh_token);
                    localStorage.setItem('kidguard_server', customUrl || window.location.origin);
                    window.location.href = '/dashboard';
                } else {
                    showError(data.error || 'Invalid credentials');
                }
            } catch (err) {
                showError('Connection failed. Check server URL.');
            }

            btn.disabled = false;
            btn.textContent = 'Sign In';
        }

        async function handleRegister(e) {
            e.preventDefault();
            clearError();
            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            const customUrl = document.getElementById('serverUrl').value.trim();
            const apiUrl = customUrl ? customUrl.replace(/\/+$/, '') + '/api' : '/api';

            try {
                const res = await fetch(`${apiUrl}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('regEmail').value.trim().toLowerCase(),
                        password: document.getElementById('regPassword').value,
                        display_name: document.getElementById('regName').value.trim(),
                        role: 'parent'
                    })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('kidguard_token', data.token);
                    localStorage.setItem('kidguard_refresh', data.refresh_token);
                    localStorage.setItem('kidguard_server', customUrl || window.location.origin);
                    window.location.href = '/dashboard';
                } else {
                    showError(data.error || 'Registration failed');
                }
            } catch (err) {
                showError('Connection failed. Check server URL.');
            }

            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    </script>
</body>
</html>
