version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kidguard
      POSTGRES_USER: kidguard
      POSTGRES_PASSWORD: change_this_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-jwt-secret}
      DATABASE_URL: postgresql://kidguard:change_this_password@db:5432/kidguard
      CLOUD_SERVER_URL: ${CLOUD_SERVER_URL:-http://localhost:5000}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot:/etc/letsencrypt
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  certbot:
